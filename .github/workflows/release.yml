# SPDX-FileCopyrightText: The Pixel contributors
# SPDX-License-Identifier: MIT
#
# A `vX.Y.Z` tag on main publishes one `pixel-recall-<target-triple>`
# executable per platform, each with a `.sha256` file (`<hex>  <name>`). That
# is what `pixel install github:Pixel-CLI/pixel-recall` downloads: the core asks
# for `pixel-<manifest name>-<target>` (`pixel-plugin/src/fetch.rs` of
# Pixel-CLI/pixel), and on Linux that target is `*-unknown-linux-musl`, so
# the Linux lanes build musl through cross rather than the runner's glibc.
#
# The four targets build into a DRAFT release: `releases/latest` keeps
# pointing at the previous release while this one is incomplete, so an
# install never lands on a release whose asset for its platform is still
# missing. The draft is published only once every asset is uploaded, and the
# smoke job then installs the published release the way a user does and runs
# every command the manifest lists. The Intel macOS asset is run by its build
# job but not by the smoke job: the core publishes no Intel macOS binary to
# install it through.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Every job reads only; the three that publish ask for the write they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  create:
    name: create the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false
      - name: the tag names the version every file carries
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace=$(sed -n -E 's/^version = "([^"]*)".*/\1/p' Cargo.toml | head -n 1)
          manifest=$(sed -n -E 's/^version = "([^"]*)".*/\1/p' pixel-plugin.toml | head -n 1)
          [ "$version" = "$workspace" ] || { echo "tag $version, Cargo.toml $workspace" >&2; exit 1; }
          [ "$version" = "$manifest" ] || { echo "tag $version, pixel-plugin.toml $manifest" >&2; exit 1; }
      - name: the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }
      # --repo everywhere: `gh` infers the repository from the checkout, and
      # the publish job below has none.
      - name: create the draft (a re-run reuses it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already exists; this run uploads to it"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: build (${{ matrix.target }})
    needs: create
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One broken target must not hide the state of the others.
      fail-fast: false
      matrix:
        # features: the flags this target's build needs beyond the defaults.
        # A backend with no build for a target — fastembed (ONNX) on musl and
        # Intel macOS — is replaced by the pure-Rust model2vec backend, so the
        # released binary keeps a working semantic channel on every platform.
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, features: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, features: "--no-default-features --features model2vec" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, features: "--no-default-features --features model2vec" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, features: "--no-default-features --features model2vec" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      # A prebuilt binary instead of `cargo install cross`: cross compiles
      # inside its own Docker image (the musl toolchain included), so the
      # runner needs no host packages and the C dependencies
      # (libsqlite3-sys, tree-sitter) link against musl. The same version the
      # core repository's release builds use.
      - name: Install cross (Linux musl)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cross@0.2.5
      - name: build (Linux musl through cross)
        if: runner.os == 'Linux'
        run: cross build --release --locked ${{ matrix.features }} --target ${{ matrix.target }} -p pixel-recall-plugin
      - name: build (macOS native)
        if: runner.os == 'macOS'
        run: cargo build --release --locked ${{ matrix.features }} --target ${{ matrix.target }} -p pixel-recall-plugin
      - name: name, hash and upload the executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pixel-recall-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/pixel-recall" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          # The binary must carry the tag's version. Only a target built for
          # this runner's architecture can run here (the aarch64 musl lane is
          # cross-compiled on an x86_64 runner); the smoke job runs it there.
          host_arch="$(uname -m)"
          if [ "$host_arch" = "arm64" ]; then host_arch=aarch64; fi
          case "${{ matrix.target }}" in
            "${host_arch}-"*)
              got="$("./$asset" --version)"
              echo "$got"
              [ "$got" = "pixel-recall ${GITHUB_REF_NAME#v}" ] \
                || { echo "::error::$asset prints '$got', expected pixel-recall ${GITHUB_REF_NAME#v}"; exit 1; }
              ;;
            *)
              # The Intel asset has no smoke: installing the core (step 1)
              # cannot happen on it, for the core publishes no Intel binary.
              echo "cross-compiled for ${{ matrix.target }}; the smoke job runs other targets"
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$asset" "$asset.sha256"

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every target uploaded: only now does `releases/latest/download`
      # answer with this tag, so an install cannot see a half-built release.
      # No checkout here, so the repository is named explicitly.
      - name: flip the draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # What the release is for: the published asset, verified directly against
  # the release it was published in, then run through the core's routing.
  # Nothing earlier in this workflow ran the released file.
  smoke:
    name: smoke (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: install pixel the way the README does
        run: |
          scratch="$(mktemp -d)"
          echo "SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo "HOME=$scratch/home" >> "$GITHUB_ENV"
          mkdir -p "$scratch/home" "$scratch/pixel"
          curl -fsSL "https://github.com/Pixel-CLI/pixel/releases/latest/download/install.sh" \
            | PIXEL_INSTALL_DIR="$scratch/pixel" sh
          "$scratch/pixel/pixel" --version

      # Any core the user installs accepts this release only from a healthy
      # download: an install that reports a build hint instead means the
      # asset was unusable.
      - name: install the plugin and report what the core does
        run: |
          out="$("$SCRATCH/pixel/pixel" install github:Pixel-CLI/pixel-recall)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qF "installed plugin recall " \
            || { echo "::error::install did not report the plugin"; exit 1; }
          if printf '%s\n' "$out" | grep -qF "not runnable"; then
            echo "::error::the core could not use the release asset"
            exit 1
          fi

      # Every plugin declares `network = true` except telemetry, and the core
      # refuses a network plugin until the user opts in; for a plugin that
      # declares none this says so and succeeds.
      - name: allow the plugin
        run: |
          "$SCRATCH/pixel/pixel" plugin enable recall

      - name: this release's asset for this platform is published and checksum-clean
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  triple=aarch64-apple-darwin ;;
            Darwin-x86_64) triple=x86_64-apple-darwin ;;
            Linux-x86_64)  triple=x86_64-unknown-linux-musl ;;
            Linux-aarch64) triple=aarch64-unknown-linux-musl ;;
            *) echo "::error::no asset triple for this runner"; exit 1 ;;
          esac
          asset="pixel-recall-$triple"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          curl -fsSL "$base/$asset" -o "$asset" \
            || { echo "::error::$asset is not published for this platform"; exit 1; }
          curl -fsSL "$base/$asset.sha256" -o "$asset.sha256"
          # `<hex>  <name>` lines check with either tool.
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "$asset.sha256" \
            || { echo "::error::$asset does not match its published .sha256"; exit 1; }
          else shasum -a 256 -c "$asset.sha256" \
            || { echo "::error::$asset does not match its published .sha256"; exit 1; }
          fi
          echo "ASSET=$PWD/$asset" >> "$GITHUB_ENV"
          chmod +x "$asset"

      - name: the asset is this plugin, at the manifest's version
        run: |
          manifest="$HOME/.pixel/plugins/recall/pixel-plugin.toml"
          want="pixel-recall $(sed -n -E 's/^version = "([^"]*)".*/\1/p' "$manifest" | head -n 1)"
          got="$("$ASSET" --version)"
          [ "$got" = "$want" ] || { echo "::error::$ASSET prints '$got', expected '$want'"; exit 1; }
          echo "$got"

      # The install above runs on the core the README ships today, which
      # leaves the repository's launcher at `run` and expects the release
      # asset to replace it (a newer core does that itself during install).
      # Do the replacement here, then route through the core.
      - name: the installed plugin runs this release's binary
        run: |
          manifest="$HOME/.pixel/plugins/recall/pixel-plugin.toml"
          run="$(sed -n -E 's/^run = "([^"]*)".*/\1/p' "$manifest" | head -n 1)"
          installed="$HOME/.pixel/plugins/recall/$run"
          cp "$ASSET" "$installed"
          want="pixel-recall $(sed -n -E 's/^version = "([^"]*)".*/\1/p' "$manifest" | head -n 1)"
          got="$("$installed" --version)"
          [ "$got" = "$want" ] || { echo "::error::$installed prints '$got', expected '$want'"; exit 1; }
          echo "$got"

      # `pixel <command> --help` proves the host routed the word to the
      # installed release binary and its parser answered. (A word the core
      # still keeps answers from the core instead.)
      - name: every command the manifest lists answers
        run: |
          manifest="$HOME/.pixel/plugins/recall/pixel-plugin.toml"
          # The manifest spells `commands` one per line inside `[ … ]`.
          commands=$(awk '/^commands = \[/ {inside = 1; next} inside && /^\]/ {inside = 0} inside {gsub(/[",]/, ""); print}' "$manifest")
          [ -n "$commands" ] || { echo "::error::$manifest lists no commands"; exit 1; }
          for command in $commands; do
            printf -- '--- pixel %s --help\n' "$command"
            "$SCRATCH/pixel/pixel" "$command" --help > /dev/null
          done
          echo "all commands answered"
